<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Ultimate Evolution Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- 背景エフェクト用キャンバス -->
    <canvas id="fwCanvas"></canvas>

    <!-- タイトル画面 -->
    <div id="title-screen">
        <h1 style="color: gold; font-size: 3rem;">EVOLUTION</h1>
        <button id="new-game-btn" class="menu-btn">はじめから</button>
        <button id="continue-btn" class="menu-btn" disabled>つづきから</button>
    </div>

    <!-- UIボタン -->
    <button id="encyclopedia-btn" class="ui-btn">図鑑を見る</button>
    <button id="back-to-title-btn" class="ui-btn">タイトルへ</button>

    <!-- メインゲームエリア -->
    <div id="game-area">
        <h2 id="msg">タマゴ</h2>
        <div id="char-wrapper">
            <img src="character/egg.png" id="char-img" alt="Character">
        </div>
        <div class="stats">
            <p>現在のクリック: <span id="clicks">0</span></p>
            <p>累計クリック: <span id="lifetime">0</span></p>
        </div>
    </div>

    <!-- 図鑑画面 -->
    <div id="encyclopedia-screen">
        <button id="close-encyclopedia">&times;</button>
        <h2 class="encyclopedia-title">EVOLUTION TREE</h2>
        <div id="tree-container"></div>
    </div>

    <!-- クリアオーバーレイ -->
    <div id="clear-overlay">
        <h1 class="clear-text">CONGRATULATIONS!</h1>
        <button id="restart-btn" class="btn-action">もう一度遊ぶ</button>
    </div>

    <!-- 確認モーダル -->
    <div id="confirm-modal">
        <div class="modal-content">
            <p>データをリセットして新しく始めますか？</p>
            <button id="confirm-yes" class="btn-action" style="background: #ff4444; color: white;">はい</button>
            <button id="confirm-no" class="btn-action">いいえ</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
