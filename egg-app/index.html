<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>タマゴゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="fwCanvas"></canvas>

    <!-- タイトル画面 -->
    <div id="title-screen">
        <h1>タマゴゲーム</h1>
        <button id="new-game-btn" class="menu-btn">New Game</button>
        <button id="continue-btn" class="menu-btn">Continue</button>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-area">
        <h1 id="msg">タマゴ</h1>
        <!-- index.html の該当箇所 -->
        <div id="char-wrapper">
            <img id="char-img" src="character/egg.png"> <!-- ここを修正 -->
        </div>
        <div class="stats">
            今回のクリック: <span id="clicks">0</span><br>
            通算クリック: <span id="lifetime">0</span>
        </div>
    </div>

    <!-- クリアオーバーレイ -->
    <div id="clear-overlay">
        <h1 class="clear-text">CLEAR !!</h1>
        <button class="btn-action" id="restart-btn">もう一度遊ぶ</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
