<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGG EVOLUTION - 聖なる進化</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <audio id="bgm" src="BGM.mp3" loop></audio>
    <canvas id="fwCanvas"></canvas>

    <!-- 右下の小さな飾りタマゴ -->
    <div id="mini-egg-deco">
        <img src="character/egg.png" alt="mini-egg">
    </div>

    <!-- タイトル画面 -->
    <div id="title-screen">
        <h1 style="color: gold; font-size: 3rem; margin-bottom: 30px;">EGG EVOLUTION</h1>
        <div class="menu-buttons">
            <button id="new-game-btn" class="menu-btn">はじめから</button>
            <button id="continue-btn" class="menu-btn" disabled>つづきから</button>
        </div>
    </div>

    <!-- UIレイヤー -->
    <div id="ui-layer" style="display: none;">
        <button id="encyclopedia-btn" class="ui-btn">図鑑を見る</button>
        <button id="back-to-title-btn" class="ui-btn">タイトルへ</button>
        <button id="settings-btn" class="ui-btn"
            style="left: 20px; bottom: 20px; top: auto; font-size: 1.5rem;">⚙️</button>
    </div>

    <!-- ゲームエリア -->
    <div id="game-area" style="display: none;">
        <h2 id="msg">タマゴ</h2>
        <div id="char-wrapper">
            <img src="character/egg.png" id="char-img">
        </div>
        <div class="stats">
            <p>現在のクリック: <span id="clicks">0</span></p>
            <p>累計クリック: <span id="lifetime">0</span></p>
            <p>ヒント: <span id="hint"></span></p>
        </div>
    </div>

    <!-- 図鑑画面 -->
    <div id="encyclopedia-screen" style="display: none;">
        <button id="close-encyclopedia">&times;</button>
        <h2 class="encyclopedia-title">EVOLUTION TREE</h2>
        <div id="tree-container"></div>
    </div>

    <!-- 設定画面 -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="position: relative; width: 300px;">
            <button id="close-settings"
                style="position: absolute; top: 10px; right: 10px; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;">&times;</button>
            <h2 style="color: gold; margin-top: 10px;">SETTINGS</h2>
            <div style="margin: 30px 0;">
                <p style="margin-bottom: 10px;">BGM Volume</p>
                <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="0" style="width: 100%;">
            </div>
        </div>
    </div>

    <!-- 確認モーダル -->
    <div id="confirm-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <p>データをリセットして新しく始めますか？</p>
            <button id="confirm-yes" class="btn-action" style="background: #ff4444; color: white;">はい</button>
            <button id="confirm-no" class="btn-action">いいえ</button>
        </div>
    </div>

    <!-- クリア画面 -->
    <div id="clear-overlay" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 class="clear-text">CONGRATULATIONS!</h2>
            <button id="restart-btn" class="btn-action">もう一度遊ぶ</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
