<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>進化の試練 - Clicker Game</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #121212;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* キャラクターエリア */
        #game-area {
            text-align: center;
            z-index: 1;
            /* ドラゴンを中層に */
        }

        #char-wrapper {
            width: 400px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #char-wrapper:active {
            transform: scale(0.95);
        }

        #char-img {
            max-width: 100%;
            max-height: 100%;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4));
            transition: filter 0.5s;
        }

        .stats-panel {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #aaa;
        }

        #total-clicks {
            font-size: 1.8rem;
            color: #ffd700;
            font-weight: bold;
        }

        /* --- クリア時の演出用設定 --- */
        #clear-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 背景を真っ暗にせず、ドラゴンが見えるように半透明にする */
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.2) 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            /* 下側にコンテンツを寄せる */
            padding-bottom: 80px;
            z-index: 10;
            /* ドラゴンの前に出すが、透明なので透けて見える */
            pointer-events: none;
            /* 下のボタン以外はクリックをスルーさせる */
        }

        #clear-content {
            pointer-events: auto;
            /* ボタン部分はクリック可能にする */
            text-align: center;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #clear-overlay h1 {
            font-size: 5rem;
            color: #ffd700;
            margin: 0;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
        }

        #restart-btn {
            margin-top: 20px;
            padding: 15px 50px;
            font-size: 1.2rem;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        #restart-btn:hover {
            background: #ffd700;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div id="game-area">
        <div id="msg" style="margin-bottom:10px; color:#888;">???</div>
        <div id="char-wrapper">
            <!-- ここに画像を配置 -->
            <img id="char-img" src="egg.png">
        </div>
        <div class="stats-panel">
            Total Clicks: <span id="total-clicks">0</span>
        </div>
    </div>

    <!-- クリア画面（ドラゴンを隠さない） -->
    <div id="clear-overlay">
        <div id="clear-content">
            <h1>CLEAR !!</h1>
            <p style="font-size: 1.2rem; margin-bottom: 20px;">伝説のドラゴンが誕生しました</p>
            <button id="restart-btn">もう一度遊ぶ</button>
        </div>
    </div>

    <script>
        const stages = [
            { threshold: 0, img: 'egg.png', msg: '卵を温めている...' },
            { threshold: 20, img: 'chicken.png', msg: '鶏に成長した！' },
            { threshold: 60, img: 'dragon.png', msg: '伝説のドラゴン覚醒！' }
        ];

        let clicks = 0;
        let currentStageIndex = 0;

        const charImg = document.getElementById('char-img');
        const totalDisplay = document.getElementById('total-clicks');
        const overlay = document.getElementById('clear-overlay');
        const restartBtn = document.getElementById('restart-btn');
        const charWrapper = document.getElementById('char-wrapper');

        charWrapper.addEventListener('click', () => {
            if (currentStageIndex >= stages.length - 1) return;

            clicks++;
            totalDisplay.innerText = clicks;

            const nextIndex = currentStageIndex + 1;
            if (stages[nextIndex] && clicks >= stages[nextIndex].threshold) {
                currentStageIndex = nextIndex;

                // 画像切り替え
                charImg.src = stages[currentStageIndex].img;

                // ドラゴンになった時の処理
                if (currentStageIndex === stages.length - 1) {
                    // ドラゴンをさらに輝かせる
                    charImg.style.filter = 'drop-shadow(0 0 40px gold) brightness(1.2)';
                    // クリア画面をふわっと出す
                    setTimeout(() => {
                        overlay.style.display = 'flex';
                    }, 500);
                }
            }
        });

        // リスタート
        restartBtn.addEventListener('click', () => {
            clicks = 0;
            currentStageIndex = 0;
            totalDisplay.innerText = "0";
            overlay.style.display = 'none';
            charImg.src = stages[0].img;
            charImg.style.filter = 'drop-shadow(0 0 20px rgba(255, 215, 0, 0.4))';
        });
    </script>

</body>

</html>
